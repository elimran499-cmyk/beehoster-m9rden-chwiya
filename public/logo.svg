<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Standalone copy of the BEEHOSTER mark in src/components/BeehosterLogo.tsx.
       Used as the favicon, the apple-touch-icon and the og:image, so it has to
       stay in step with the component by hand. -->
  <defs>
    <linearGradient id="bh-badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FDF1F4"/>
    </linearGradient>
    <linearGradient id="bh-wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F9A8C0"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <clipPath id="bh-body">
      <circle cx="32" cy="37" r="12.5"/>
    </clipPath>
  </defs>

  <!-- Badge: solid plate first so the mark is never see-through, gradient over it -->
  <rect x="3" y="3" width="58" height="58" rx="20" fill="#FFFFFF"/>
  <rect x="3" y="3" width="58" height="58" rx="20" fill="url(#bh-badge)" stroke="#BE123C" stroke-width="2.5"/>

  <!-- Wings -->
  <g fill="url(#bh-wing)" fill-opacity="0.5" stroke="#BE123C" stroke-width="1.3">
    <ellipse cx="17" cy="27" rx="11" ry="6.4" transform="rotate(-22 17 27)"/>
    <ellipse cx="47" cy="27" rx="11" ry="6.4" transform="rotate(22 47 27)"/>
  </g>

  <!-- Antennae -->
  <g stroke="#16150F" stroke-width="1.9" stroke-linecap="round" fill="none">
    <path d="M28.5 12.5c-1.8-1.6-3.6-2.2-5.4-1.9"/>
    <path d="M35.5 12.5c1.8-1.6 3.6-2.2 5.4-1.9"/>
  </g>

  <!-- Head -->
  <circle cx="32" cy="17.5" r="6" fill="#16150F"/>

  <!-- Body with two accent stripes, clipped to the abdomen -->
  <circle cx="32" cy="37" r="12.5" fill="#16150F"/>
  <g clip-path="url(#bh-body)">
    <rect x="18" y="30.6" width="28" height="4.4" fill="#BE123C"/>
    <rect x="18" y="39.2" width="28" height="4.4" fill="#BE123C"/>
  </g>
</svg>
